[bar]
position = "top"
size = 36
spacing = 2
screen_margin = 0
inset = 4
padding = 0
border_radius = 0
background_color = "#000000"
background_opacity = 1.0

[widgets]
left = ["workspaces", "custom-crypto"]
center = ["weather", "clock"]
right = [
  "tray",
  "system_monitor",
  "headset",
  "keyboard_layout",
  "quick_settings",
  "os_logo",
]
border_radius = 50
background_opacity = 0.0
popover_background_opacity = 0.76

[widgets.workspaces]
label_type = "none"
animate = true
filter_by_output = true
show_unoccupied = false

[widgets.clock]
format = "%A, %b %d  %H:%M"
control_panel = true
world_clocks = [
  { label = "New York", timezone = "America/New_York" },
]

[widgets.custom-crypto]
label = ""
exec = "/home/trev/Workspace/dotfiles/gnome-topbar/.config/gnome-topbar/scripts/crypto.sh -r"
interval = 1800
tooltip = "Crypto prices"
max_chars = 40

[widgets.weather]
unit = "celsius"
interval = 1800
tooltip = "Weather"
max_chars = 24
forecast_days = 5

[widgets.headset]
interval = 5
tooltip = "Headset battery"
max_chars = 12

[widgets.system_monitor]
cpu_threshold = 90
memory_threshold = 85
interval = 5
tooltip = "System load"

[widgets.quick_settings]
on_click_right = "/run/current-system/profile/bin/loginctl lock-session"

[theme]
mode = "dark"
accent = "#4a997f"
animations = true
ripple = true
blur = true
outline = false

[theme.icons]
theme = "Adwaita"
weight = 400

[theme.states]
success = "#22c55e"
warning = "#f59e0b"
urgent = "#ef4444"

[theme.typography]
font_family = "NotoSans, IosevkaJBM, Symbols Nerd Font Mono, Symbols Nerd Font"

[osd]
enabled = true
position = "bottom"
timeout_ms = 1500
show_value = false

[audio]
allow_overdrive = false

[advanced]
compositor = "niri"
pango_font_rendering = true

[updates]
update_count_command = "guixboy updates --quiet"
check_interval = 3600
