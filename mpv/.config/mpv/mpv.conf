# Playback quality and usability
profile=gpu-hq
hwdec=auto-safe
save-position-on-quit=yes
keep-open=yes
sub-auto=fuzzy

# Streaming buffer: allow up to 1 GiB and prebuffer 10 seconds at startup.
cache=yes
demuxer-max-bytes=1GiB
demuxer-max-back-bytes=128MiB
cache-pause-initial=yes
cache-pause-wait=10
