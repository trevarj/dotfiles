# Stock MangoWM 0.18.2; Niri remains the default/recovery login session.
# Validate this file and its generated color fragment separately with mango -p.
var=mainmod,SUPER
source=~/.local/share/trev-themes/current/mango.conf

# Input: normal bind resolves keycodes, preserving H/J/K/L under Russian.
xkb_rules_layout=us,ru
xkb_rules_options=compose:ralt,ctrl:nocaps
repeat_rate=50
repeat_delay=250
numlock_on=1
cursor_theme=Adwaita
cursor_size=24
tap_to_click=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
mouse_accel_profile=1
sloppy_focus=1
warp_cursor=0
drag_warp_cursor=0
edge_scroller_pointer_focus=0
# Keep native client shortcut grabs; stock Mango has no Super+Escape override.
allow_shortcuts_inhibit=1

# Outputs: first matching rule wins; omit x/y for automatic physical placement.
# External is X11 primary when present; native fallback handles its absence.
monitor_rule=name:^DP-5$,width:3840,height:2160,refresh:120,scale:1.5,primary:1,vrr:0,hdr:0
monitor_rule=name:^eDP-1$,width:1920,height:1200,refresh:60.002,scale:1,vrr:0,hdr:0
xwayland_ignore_scale=0
allow_tearing=0
# Native lid events remove the internal output while the laptop is closed.
switchbind=fold,disable_monitor,eDP-1
switchbind=unfold,enable_monitor,eDP-1

# Layout and tags: persistent destinations match topbar's advanced.mango lists.
gap_inner_horizontal=28
gap_inner_vertical=28
gap_outer_horizontal=28
gap_outer_vertical=28
border_px=3
border_radius=12
smart_gaps=0
no_border_when_single=0
no_radius_when_single=0
tag_num=9
tag_gather=0
tag_carousel=0
view_current_to_back=0
circle_layout=scroller,fair,dwindle
tag_rule=id:1,layout_name:scroller,no_hide:1
tag_rule=id:2,layout_name:scroller,no_hide:1
tag_rule=id:3,layout_name:scroller,no_hide:1
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:scroller
tag_rule=id:7,layout_name:scroller
tag_rule=id:8,layout_name:scroller
tag_rule=id:9,layout_name:scroller
scroller_default_proportion=0.5
scroller_proportion_preset=0.33333,0.5,0.66667
scroller_focus_center=0
scroller_prefer_center=0
scroller_prefer_overspread=0
# A lone stack is centered natively; keep ordinary width controls effective.
scroller_ignore_proportion_single=1
dwindle_split_ratio=0.5
dwindle_smart_split=0
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0
# Fair and unused layout families retain their native defaults.
enable_hotarea=0
enable_floating_snap=1
snap_distance=30
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9

# Effects: keep app content opaque and dim through Mango's native overlay.
blur=1
blur_layer=1
# Blur live content behind layers, not only cached wallpaper; higher GPU cost.
blur_optimized=0
blur_params_radius=5
blur_params_num_passes=2
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.0
shadows=1
layer_shadows=1
shadow_only_floating=0
shadows_size=12
shadows_blur=20
shadows_position_x=0
shadows_position_y=0
shadows_color=0x00000066
focused_opacity=1
unfocused_opacity=1
dim_enable=1
dim_focused_color=0x00000000
dim_unfocused_color=0x00000022

# Expressive eased motion; this release has no true springs or layer durations.
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
layer_animation_type_open=slide
layer_animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
zoom_initial_ratio=0.85
zoom_end_ratio=0.9
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.5
animation_duration_open=300
animation_duration_move=300
animation_duration_tag=320
animation_duration_close=250
animation_duration_focus=160
tag_animation_direction=0
animation_curve_open=0.34,1.35,0.64,1
animation_curve_move=0.34,1.35,0.64,1
animation_curve_tag=0.34,1.35,0.64,1
animation_curve_close=0.46,1,0.29,1
animation_curve_focus=0.46,1,0.29,1
animation_curve_opacity_fade_in=0.46,1,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5

# Rules: exact layer namespaces, never transparent input-catcher rectangles.
layer_rule=layer_name:^topbar-(launcher|chooser|dialog|pinentry)$,animation_type_open:zoom,animation_type_close:zoom
layer_rule=layer_name:^topbar-(launcher|chooser|dialog|pinentry)-backdrop$,animation_type_open:fade,animation_type_close:fade
layer_rule=layer_name:^topbar-(popover|osd|toast)$,animation_type_open:slide,animation_type_close:slide
layer_rule=layer_name:^topbar-tooltip$,animation_type_open:fade,animation_type_close:fade
layer_rule=layer_name:^(selection|topbar-click-catcher)$,no_animation:1,no_blur:1,no_shadow:1
# Hyprlock uses ext-session-lock, already outside Mango's layer animation path.
window_rule=app_id:.*,allow_csd:0
# Full-width Scroller appearance, not a fabricated maximized-state rule.
window_rule=app_id:^brave-browser$,tags:1,scroller_proportion:1.0,scroller_proportion_single:1.0,is_open_silent:0,is_tag_silent:0
window_rule=app_id:^emacs$,tags:2,scroller_proportion:1.0,scroller_proportion_single:1.0
window_rule=app_id:^org\.telegram\.desktop$,tags:3,scroller_proportion:1.0,scroller_proportion_single:1.0
window_rule=app_id:firefox$,title:^Picture-in-Picture$,is_floating:1
# Fullscreen-only approximation of Niri's mpv on-demand VRR; no global VRR.
window_rule=app_id:^mpv$,vrr_only_fullscreen:1
# 0.18.2 marks named scratchpads floating before show_scratchpad applies ratios.
window_rule=title:^kitty-scratch$,is_named_scratchpad:1,width:0.8,height:0.9

# Applications and session tools. Only media/brightness/Orca work while locked.
bind=$mainmod,Return,spawn,kitty
bind=$mainmod,e,spawn,topbar launcher toggle
bind=$mainmod,b,spawn,browser
bind=$mainmod+ALT,l,spawn_shell,pidof hyprlock || hyprlock --config ~/.config/hypr/hyprlock-mango.conf
bind=$mainmod+ALT,Return,spawn,ddcutil -b 18 setvcp 60 0x0f
bind=$mainmod+CTRL,w,spawn,svc restart topbar
bind=$mainmod+ALT,t,spawn,theme-switch
bind=$mainmod,p,spawn,theme-switch --pick-wallpaper
bind=$mainmod+CTRL,p,spawn,theme-switch --refresh-wallpaper
bindl=$mainmod+ALT,s,spawn_shell,pkill orca || exec orca
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl --class=backlight set +10%
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl --class=backlight set 10%-
bind=$mainmod+SHIFT,p,spawn,wlopm --off '*'
# Quick settings retains its 650 ms hold-to-log-out protection.
bind=$mainmod+SHIFT,e,spawn,topbar popover show quick_settings
bind=CTRL+ALT,Delete,spawn,topbar popover show quick_settings

# Directional focus, same-output stack exchange, output focus and window moves.
bind=$mainmod,Left,focusdir,left
bind=$mainmod,Down,focusdir,down
bind=$mainmod,Up,focusdir,up
bind=$mainmod,Right,focusdir,right
bind=$mainmod,h,focusdir,left
bind=$mainmod,j,focusdir,down
bind=$mainmod,k,focusdir,up
bind=$mainmod,l,focusdir,right
bind=$mainmod+CTRL,Left,exchange_client,left
bind=$mainmod+CTRL,Down,exchange_client,down
bind=$mainmod+CTRL,Up,exchange_client,up
bind=$mainmod+CTRL,Right,exchange_client,right
bind=$mainmod+CTRL,h,exchange_client,left
bind=$mainmod+CTRL,j,exchange_client,down
bind=$mainmod+CTRL,k,exchange_client,up
bind=$mainmod+CTRL,l,exchange_client,right
bind=$mainmod+SHIFT,Left,focusmon,left
bind=$mainmod+SHIFT,Down,focusmon,down
bind=$mainmod+SHIFT,Up,focusmon,up
bind=$mainmod+SHIFT,Right,focusmon,right
bind=$mainmod+SHIFT,h,focusmon,left
bind=$mainmod+SHIFT,j,focusmon,down
bind=$mainmod+SHIFT,k,focusmon,up
bind=$mainmod+SHIFT,l,focusmon,right
bind=$mainmod+CTRL+SHIFT,Left,tagmon,left,1
bind=$mainmod+CTRL+SHIFT,Down,tagmon,down,1
bind=$mainmod+CTRL+SHIFT,Up,tagmon,up,1
bind=$mainmod+CTRL+SHIFT,Right,tagmon,right,1
bind=$mainmod+CTRL+SHIFT,h,tagmon,left,1
bind=$mainmod+CTRL+SHIFT,j,tagmon,down,1
bind=$mainmod+CTRL+SHIFT,k,tagmon,up,1
bind=$mainmod+CTRL+SHIFT,l,tagmon,right,1

# Numeric tag selection replaces the selection; moves transfer one window.
bind=$mainmod,1,view,1
bind=$mainmod,2,view,2
bind=$mainmod,3,view,3
bind=$mainmod,4,view,4
bind=$mainmod,5,view,5
bind=$mainmod,6,view,6
bind=$mainmod,7,view,7
bind=$mainmod,8,view,8
bind=$mainmod,9,view,9
bind=$mainmod+CTRL,1,tag,1
bind=$mainmod+CTRL,2,tag,2
bind=$mainmod+CTRL,3,tag,3
bind=$mainmod+CTRL,4,tag,4
bind=$mainmod+CTRL,5,tag,5
bind=$mainmod+CTRL,6,tag,6
bind=$mainmod+CTRL,7,tag,7
bind=$mainmod+CTRL,8,tag,8
bind=$mainmod+CTRL,9,tag,9
bind=$mainmod,Page_Up,viewtoleft
bind=$mainmod,Page_Down,viewtoright
bind=$mainmod,i,viewtoleft
bind=$mainmod,u,viewtoright
bind=$mainmod+CTRL,Page_Up,tagtoleft
bind=$mainmod+CTRL,Page_Down,tagtoright
bind=$mainmod+CTRL,i,tagtoleft
bind=$mainmod+CTRL,u,tagtoright
axis_bind_apply_timeout=150
axisbind=$mainmod,UP,viewtoleft
axisbind=$mainmod,DOWN,viewtoright
axisbind=$mainmod+CTRL,UP,tagtoleft
axisbind=$mainmod+CTRL,DOWN,tagtoright
axisbind=$mainmod,LEFT,focusdir,left
axisbind=$mainmod,RIGHT,focusdir,right
axisbind=$mainmod+CTRL,LEFT,exchange_client,left
axisbind=$mainmod+CTRL,RIGHT,exchange_client,right
axisbind=$mainmod+SHIFT,UP,focusdir,left
axisbind=$mainmod+SHIFT,DOWN,focusdir,right
axisbind=$mainmod+CTRL+SHIFT,UP,exchange_client,left
axisbind=$mainmod+CTRL+SHIFT,DOWN,exchange_client,right

# Window state, width presets, native overview and all-output MRU switching.
bind=$mainmod,w,killclient
bind=$mainmod,bracketleft,scroller_stack,left
bind=$mainmod,bracketright,scroller_stack,right
bind=$mainmod,r,switch_proportion_preset,next
bind=$mainmod,f,togglemaximizescreen
bind=$mainmod+SHIFT,f,togglefullscreen
bind=$mainmod,c,centerwin
bind=$mainmod,v,togglefloating
# Signed zero leaves the unaffected floating dimension unchanged.
bind=$mainmod,minus,resizewin,-40,+0
bind=$mainmod,equal,resizewin,+40,+0
bind=$mainmod+SHIFT,minus,resizewin,+0,-40
bind=$mainmod+SHIFT,equal,resizewin,+0,+40
bind=$mainmod,o,toggleoverview
bind=ALT,Tab,switcher,all_next
bind=ALT+SHIFT,Tab,switcher,all_prev
bind=$mainmod,Tab,switcher,all_next
bind=$mainmod+SHIFT,Tab,switcher,all_prev
bind=$mainmod,space,switch_keyboard_layout
bind=$mainmod+ALT,space,switch_layout
bind=$mainmod+ALT,grave,toggle_named_scratchpad,none,^kitty-scratch$,kitty -T kitty-scratch
mousebind=$mainmod,btn_left,moveresize,curmove
mousebind=$mainmod,btn_right,moveresize,curresize

# Spatial touchpad gestures; native overview retains right-click-to-close.
gesture_live=1
gesturebind=NONE,left,3,focusdir,left
gesturebind=NONE,right,3,focusdir,right
gesturebind=NONE,up,3,viewtoright
gesturebind=NONE,down,3,viewtoleft
gesturebind=NONE,up,4,enteroverview
gesturebind=NONE,down,4,leaveoverview

# Capture: no geometry fallback around a compositor privacy denial.
bind=NONE,Print,spawn,mango-screenshot region
bind=CTRL,Print,spawn,mango-screenshot output
bind=ALT,Print,spawn,mango-screenshot window

# Deliberately unbound Niri gaps: same-app grave switching, workspace reordering,
# Home/End first/last-column actions, height presets/reset, center-visible-columns,
# expand-to-remaining-width, floating/tiling focus toggle, hotkey overlay, tabbed
# column display, comma/period consume/expel, and the shortcut-inhibit escape toggle.
# Stock Mango offers inhibition permission, not Niri's escape-toggle dispatcher.

# Startup: Mango's native session target starts supervised daemons and topbar.
# Check the initial lid state too; switch bindings only handle later changes.
exec_once=sh -c 'if [ "$(busctl get-property org.freedesktop.login1 /org/freedesktop/login1 org.freedesktop/login1.Manager LidClosed)" = "b true" ]; then mmsg dispatch disable_monitor,eDP-1; fi'
