#
# Plugins are installed by home-manager (modules/home/tmux.nix), not TPM, and
# prefix/mouse/history/vi-mode live there too. This file is everything else:
# key bindings, plugin options, the theme, and the agent workflow.

###
### Set globals
###

set -g default-command $SHELL
set-option -sa terminal-features ',ghostty*:RGB:hyperlinks:clipboard:usstyle'
set-option -sa terminal-features ',kitty*:RGB:hyperlinks:clipboard:usstyle'
set-option -sa terminal-features ',xterm-256color:RGB'

# Unicode
setenv -g LANG "en_US.UTF-8"
setenv -g LC_ALL "en_US.UTF-8"
# Window numbering starts at 1 (base-index) and gets renumbered on deletion
set -g renumber-windows on

###
### Coding agents (pi, claude, codex)
###

# tmux strips the modifier off Enter unless extended keys are on, which
# collapses Shift+Enter and Ctrl+Enter into a plain submit. csi-u needs tmux
# 3.5 or newer. Changing either of these needs a full `tmux kill-server`.
set -g extended-keys on
set -g extended-keys-format csi-u
# Agents redraw on focus and emit OSC sequences for links, images and progress.
set -g focus-events on
set -g allow-passthrough on
set -g set-clipboard on

###
### Key Bindings
###

# Ctrl + a + q, then 'y' to kill session
bind-key q confirm-before kill-session
bind -T copy-mode y send-keys -X copy-pipe-and-cancel 'wl-copy'

# Watch the current window for an agent going quiet, and stop watching. Not a
# global default: an idle shell produces no output either, so every window
# would alert.
bind m setw monitor-silence 15 \; display-message "idle watch on (15s)"
bind M setw monitor-silence 0 \; display-message "idle watch off"

# M-o = emacs other-window: cycle to next pane (no prefix, root table)
bind-key -n M-o select-pane -t :.+
# prefix + b = emacs C-x b: replace the current pane with any other pane
# (across all sessions), in-place, no split. Logic lives in a script to dodge
# tmux's $/$() string processing in the display-popup arg.
bind b display-popup -E -w 60% -h 50% -T 'Bring pane here' "~/.tmux/scripts/bring-pane.sh"

# Use fzf and ton to open file paths found in all buffers
bind f display-popup -E -w 40% -h 40% -T 'Tmux File Paths' \
  "~/.config/nvim/scripts/tmux_file_paths.sh \
  | fzf --prompt='Open: ' \
		--pointer= \
		--layout=reverse \
		--info=inline-right \
		--keep-right \
		--color=gutter:-1 \
    --delimiter=: \
  | ~/.tmux/plugins/tmux-open-nvim/scripts/ton"

###
### THEME
###
### No palette of its own: the bar is transparent (bg=default) and every accent
### is an ANSI index, so tmux wears whatever theme the terminal is using —
### kitty's Nord today, ghostty's, or the Modus light/dark autoswitch. The
### window list mirrors kitty's tab bar: active is yellow on black, inactive is
### dim grey on the terminal background.
###

set -g status-left-length 60
set -g status-right-length 60
set -g status-style "bg=default"
set -g message-style "fg=colour3,bg=colour0"
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour4"
set -g pane-border-lines "single"
set -g status-left "#[fg=colour4,bold] #S "
# Nothing on the right but the prefix indicator, which only appears while the
# prefix is held.
set -g status-right "#{prefix_highlight}"

# A window running an agent is marked with 󱚝; 󰂚 means it rang the bell (done,
# or waiting on input) and 󰒲 means the idle watch fired. node and systemd-run
# cover wrapped agents; sandboxed pi uses the latter for its transient unit.
agent_flag="#{?#{m/r:^(pi|claude|codex|node|systemd-run)$,#{pane_current_command}},󱚝 ,}"
alert_flags="#{?window_bell_flag, 󰂚,}#{?window_silence_flag, 󰒲,}"
set -g window-status-format "$agent_flag#I.#W$alert_flags #F"
set -g window-status-style "fg=colour8,bg=default"
set -g window-status-current-format " $agent_flag#W$alert_flags "
set -g window-status-current-style "fg=colour3,bg=colour0,bold"
set -g window-status-bell-style "fg=colour1,bold"
set -g window-status-separator " "
set -g mode-style "fg=colour0,bg=colour4"
set -g @prefix_highlight_fg colour0
set -g @prefix_highlight_bg colour3
set -g menu-style "fg=colour7,bg=colour0"
set -g menu-selected-style "fg=colour0,bg=colour3"
set -g menu-border-style "fg=colour3,bg=colour0"
set -g menu-border-lines "rounded"
set -g popup-border-style "fg=colour3,bg=colour0"
set -g popup-border-lines "rounded"
# Monitor other window activity
setw -g monitor-activity on
setw -g monitor-bell on
set -g bell-action other
setw -g window-status-activity-style none

###
### Notifications
###
### An agent that finishes or asks a question in a background window should
### reach the desktop, not wait to be noticed. The bell is what the agents
### themselves ring; the silence hook only fires for windows armed with
### prefix + m.
###

set-hook -g alert-bell 'run-shell -b "notify-send -a tmux \"#{session_name}:#{window_index} #{window_name}\" \"finished, or waiting on input\""'
set-hook -g alert-silence 'run-shell -b "notify-send -a tmux \"#{session_name}:#{window_index} #{window_name}\" \"idle for 15s\""'

###
### Fingers (quick copy)
###
set -g @fingers-key C-space
set -g @fingers-keyboard-layout 'qwerty-left-hand'
# matches against paths with row:col at the end, like on rustc output
set -g @fingers-pattern-0 "(([.\\w\\-~\\$@]+)(\\/?[\\w\\-@]+)+\\/?)\\.([\\w]+)(:\\d*:\\d*)?"
set -g @fingers-ctrl-action "xargs -I {} tmux run-shell 'cd #{pane_current_path}; ~/.tmux/plugins/tmux-open-nvim/scripts/ton {} > ~/.cache/tmux-open-nvim.log'"
set -g @fingers-alt-action "xargs -I {} xdg-open {}"
set -g @fingers-backdrop-style "fg=white,dim"

### tmux-open-nvim
set -g @ton-open-strategy ":e"
set -g @ton-menu-style ""
set -g @ton-menu-selected-style "fg=brightblack,bg=blue"
set -g @ton-prioritize-window false

###
### SESSION
###
set -g @resurrect-processes 'ssh weechat'
set -g @continuum-restore 'on'
# set -g @continuum-save-interval '10'
