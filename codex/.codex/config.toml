model = "gpt-5.3-codex"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
approvals_reviewer = "guardian_subagent"

[agents]
max_threads = 6
max_depth = 1

[projects."/home/trev/Workspace"]
trust_level = "trusted"

[tui]
theme = "nord"
status_line = ["run-state", "task-progress", "model-with-reasoning", "current-dir", "git-branch", "context-used", "five-hour-limit"]

[tui.model_availability_nux]
"gpt-5.5" = 4

[features]
terminal_resize_reflow = true

[notice]
hide_rate_limit_model_nudge = true
