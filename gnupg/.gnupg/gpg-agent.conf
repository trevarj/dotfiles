# Guix Home only. The Nix host generates its own gpg-agent.conf from
# services.gpg-agent (same pinentry and TTLs), so this file is not deployed
# there and the path below does not need to be host-neutral.
pinentry-program /home/trev/.guix-home/profile/bin/pinentry-fuzzguy
allow-loopback-pinentry
default-cache-ttl 43200
max-cache-ttl 43200
