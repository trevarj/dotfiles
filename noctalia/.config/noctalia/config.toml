# Shared preferences; physical-output widget placement belongs to the host.
[accessibility]
ui_scale = 1.15

[shell]
font_family = "Noto Sans"
avatar_path = "~/Pictures/Art_and_Design/duckling-brick-wall.jpg"
telemetry_enabled = false
external_ip_enabled = false
polkit_agent = true
launch_apps_as_systemd_services = true
clipboard_enabled = true
clipboard_history_max_entries = 100
clipboard_auto_paste = "off"
clipboard_confirm_clear_history = true

[shell.screenshot]
copy_to_clipboard = true
save_to_file = true
annotate = true
pipe_to_command = false

[shell.animation]
enabled = true
speed = 1.0

[shell.shadow]
direction = "down"
alpha = 0.35

[shell.panel]
transparency_mode = "soft"
shadow = true
launcher_placement = "floating"
clipboard_placement = "floating"
control_center_placement = "attached"
wallpaper_placement = "attached"
session_placement = "attached"
launcher_position = "center"
clipboard_position = "center"

[shell.launcher]
layout = "full"
app_grid = true
search_position = "top"
default_view = "recent"
categories = true
show_navigation_labels = false
track_usage = true
sort_by_usage = true

[dock]
enabled = false

[desktop_widgets]
enabled = false

[bluetooth]
connection_notifications = true

[system.monitor]
enabled = true

[control_center]
hidden_tabs = []

[control_center.media]
show_visualizer = false

[[control_center.shortcuts]]
type = "dark_mode"

[[control_center.shortcuts]]
type = "clipboard"

[[control_center.shortcuts]]
type = "noctalia/wallhaven:shortcut"

[[control_center.shortcuts]]
type = "theblackdon/theme-switcher:open"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "session"

[wallpaper]
directory = "~/Pictures/Wallpapers"
enabled = true
fill_mode = "crop"
transition = ["fade"]
transition_duration = 600

[wallpaper.automation]
enabled = false

[wallpaper.default]
path = "~/Pictures/Wallpapers/autumn-valley-and-deer-painting.jpg"

[wallpaper.last]
path = "~/Pictures/Wallpapers/autumn-valley-and-deer-painting.jpg"

[theme]
source = "community"
builtin = "Ayu"
community_palette = "Kanagawa Paper"
wallpaper_scheme = "soft"
mode = "dark"
shell_mode = "follow"
pure_black_dark = true
sync_color_scheme = true

[theme.templates]
enable_builtin_templates = true
builtin_ids = ["btop", "kitty", "qt", "gtk3", "gtk4"]
enable_community_templates = false

[nightlight]
enabled = false

[location]
auto_locate = false
address = ""

[weather]
enabled = true
unit = "metric"
refresh_minutes = 30

[storage]
key_source = "secret-service"

[notification]
enable_daemon = true
background_opacity = 0.8
border = false
position = "top_center"
follow_focused_output = true
max_visible = 3
layer = "top"
history_retention_hours = 168
filter_order = ["quiet"]

[notification.filter.quiet]
enabled = true
match_content = ".*"
play_sound = false
show_toast = true
save_history = true

[idle]
pre_action_fade_seconds = 0
behavior_order = ["dim", "lock", "screen-off", "locked-off"]

[idle.behavior.dim]
enabled = true
timeout = 150
locked_timeout = 0
action = "command"

[idle.behavior.lock]
enabled = true
timeout = 600
locked_timeout = 0
action = "lock"

[idle.behavior.screen-off]
enabled = true
timeout = 601
locked_timeout = 0
action = "screen_off"

[idle.behavior.locked-off]
enabled = true
timeout = 0
locked_timeout = 10
action = "screen_off"

[lockscreen]
enabled = true
lock_before_suspend = true
grace_period_seconds = 0
allow_empty_password = false
blurred_desktop = false
blur_intensity = 0.5
tint_intensity = 0.3
wallpaper = ""
transition = ["fade"]
transition_duration = 300

[bar.main]
enabled = true
position = "top"
thickness = 38
margin_ends = 0
margin_edge = 0
radius = 16
radius_top_left = 0
radius_top_right = 0
concave_edge_corners = true
reserve_space = true
auto_hide = false
layer = "top"
font_family = "Noto Sans"
font_weight = 700
scale = 1.25
font_scale = 0.8
background_opacity = 1.0
compositor_blur = true
widget_spacing = 8
padding = 14
capsule = true
capsule_fill = "surface_container"
capsule_thickness = 0.76
capsule_padding = 6
capsule_radius = 12
# Only the idle fill is transparent; native hover feedback is separate.
capsule_opacity = 0.0
capsule_border = ""
hover_highlight = true
start = ["workspaces", "umbriel-companion", "crypto"]
center = ["weather", "clock", "bar", "notifications"]
end = ["tray", "headset", "keyboard_layout", "group:status", "nixos-updates", "launcher"]

[[bar.main.capsule_group]]
id = "status"
members = ["network", "tunnel-status", "bluetooth", "output_volume", "battery", "privacy"]
accordion = false
opacity = 0.0
border = ""

[widget.workspaces]
type = "workspaces"
monitors = []
style = "regular"
show_labels = false
hide_when_empty = false
empty_color = "tertiary_container"
occupied_color = "tertiary"
scale = 0.8
pill_scale = 0.75

[widget.umbriel-companion]
type = "noctalia/umbriel-companion:bar"
display_mode = "layout"
show_layout_name = false
show_workspace_name = false
scroll_cycles_layout = false

[widget.crypto]
type = "ayagmar/binance:bar"
show = "price"
assets = ["BTCUSDT", "ETHUSDT", "ETHBTC"]
cycle_seconds = 10

[widget.weather]
type = "weather"

[widget.clock]
type = "clock"
format = "{:%A, %b %d  %H:%M}"

[widget.clock.actions]
left = "panel-toggle control-center home"
right = "panel-toggle noctalia/world_clock:panel"

[widget.bar]
type = "noctalia/world_clock:bar"
font_scale = 1.01

[widget.notifications]
type = "notifications"
hide_when_no_unread = true

[widget.tray]
type = "tray"

[widget.disk]
type = "sysmon"
stat = "disk_used_pct"
path = "/"
visualization = "none"
show_value = true
show_glyph = true
label_show_units = true

[widget.headset]
type = "vavadik/headsetcontrol:widget"
show_percentage = true
hide_when_unavailable = true

[widget.keyboard_layout]
type = "keyboard_layout"

[widget.network]
type = "network"
show_label = false
vpn_status = "both"

[widget.network.actions]
right = "session lock"

[widget.tunnel-status]
type = "trev/tunnel-status:widget"

[widget.bluetooth]
type = "bluetooth"
hide_when_adapter_off = true
hide_when_no_connected_device = false

[widget.bluetooth.actions]
right = "session lock"

[widget.output_volume]
type = "volume"
device = "output"
show_label = false

[widget.output_volume.actions]
right = "session lock"

[widget.input_volume]
type = "volume"
device = "input"
hide_when_inactive = false

[widget.input_volume.actions]
right = "session lock"

[widget.battery]
type = "battery"

[widget.battery.actions]
right = "session lock"

[widget.privacy]
type = "privacy"
hide_inactive = true

[widget.privacy.actions]
right = "session lock"

[widget.nixos-updates]
type = "dmopp/nixos-updates:updates"
hide_when_up_to_date = true

[widget.launcher]
type = "custom_button"
glyph = ""
label = "\uf313"
font_family = "Symbols Nerd Font Mono"
font_scale = 1.25
tooltip = "Launcher"

[widget.launcher.actions]
left = "panel-toggle launcher"

[plugins]
auto_update = "none"
enabled = ["noctalia/world_clock", "vavadik/headsetcontrol", "ayagmar/binance", "dmopp/nixos-updates", "noctalia/umbriel-companion", "noctalia/wallhaven", "trev/tunnel-status", "theblackdon/theme-switcher"]

[plugin_settings."vavadik/headsetcontrol"]
poll_interval = 5
