general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}

listener {
    timeout = 150
    on-timeout = sh -c 'niri msg --json outputs | jq -e ".[] | select(.name == \"eDP-1\" and .current_mode != null and .logical != null)" >/dev/null && brightnessctl -s set 10'
    on-resume = sh -c 'niri msg --json outputs | jq -e ".[] | select(.name == \"eDP-1\" and .current_mode != null and .logical != null)" >/dev/null && brightnessctl -r'
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 601
    on-timeout = niri msg action power-off-monitors
    on-resume = niri msg action power-on-monitors
}

# Bypass idle inhibitors only for locked monitors, not automatic locking.
listener {
    timeout = 30
    ignore_inhibit = true
    on-timeout = pidof hyprlock && niri msg action power-off-monitors
    on-resume = niri msg action power-on-monitors
}
