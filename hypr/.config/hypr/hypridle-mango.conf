general {
    lock_cmd = pidof hyprlock || hyprlock --config ~/.config/hypr/hyprlock-mango.conf
    before_sleep_cmd = loginctl lock-session
}

listener {
    timeout = 150
    on-timeout = sh -c 'mmsg get monitor eDP-1 | jq -e "select(.name == \"eDP-1\" and (.width | type == \"number\") and (.height | type == \"number\") and .width > 0 and .height > 0)" >/dev/null && brightnessctl -s set 10'
    on-resume = sh -c 'mmsg get monitor eDP-1 | jq -e "select(.name == \"eDP-1\" and (.width | type == \"number\") and (.height | type == \"number\") and .width > 0 and .height > 0)" >/dev/null && brightnessctl -r'
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 601
    on-timeout = wlopm --off '*'
    on-resume = wlopm --on '*'
}

# Bypass idle inhibitors only for locked monitors, not automatic locking.
listener {
    timeout = 30
    ignore_inhibit = true
    on-timeout = pidof hyprlock && wlopm --off '*'
    on-resume = wlopm --on '*'
}
