$font = Noto Sans
$color_accent = rgba(ffd166ff)
$color_text = rgba(f4f4f5f2)
$color_text_muted = rgba(f4f4f594)
$color_error = rgba(ef4444dd)

general {
    hide_cursor = true
    fail_timeout = 900
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /home/trev/.cache/wallpaper/current-blurred.png
    color = rgba(111827ff)
    blur_size = 0
    blur_passes = 0
}

input-field {
    monitor = eDP-1
    size = 360, 56
    outline_thickness = 2
    inner_color = rgba(050505c8)
    font_color = $color_text

    outer_color = rgba(ffffff24)
    check_color = $color_accent
    fail_color = $color_error

    fade_on_empty = false
    rounding = 14

    font_family = $font
    placeholder_text = Enter a password...
    fail_text = Authentication failed

    dots_size = 0.24
    dots_spacing = 0.25

    position = 0, -56
    halign = center
    valign = center
}

label {
    monitor = eDP-1
    text = Locked
    font_size = 15
    font_family = $font
    color = $color_text_muted

    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor = eDP-1
    text = $TIME
    font_size = 90
    font_family = $font
    color = $color_text

    position = 0, 164
    halign = center
    valign = center
}

label {
    monitor = eDP-1
    text = cmd[update:60000] date +"%A, %B %-d"
    font_size = 24
    font_family = $font
    color = $color_text_muted

    position = 0, 82
    halign = center
    valign = center
}

label {
    monitor = eDP-1
    text = Welcome, trev
    font_size = 18
    font_family = $font
    color = $color_text_muted

    position = 0, 32
    halign = center
    valign = center
}

label {
    monitor = eDP-1
    text = $LAYOUT[en,ru]
    font_size = 16
    font_family = $font
    color = $color_text_muted
    onclick = niri msg action switch-layout next

    position = -24, 24
    halign = right
    valign = bottom
}

label {
    monitor = eDP-1
    text = cmd[update:30000] sh -c 'capacity=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n1); [ -n "$capacity" ] && printf "%s%%" "$capacity"'
    font_size = 16
    font_family = $font
    color = $color_text_muted

    position = 24, 24
    halign = left
    valign = bottom
}

input-field {
    monitor = DP-5
    size = 432, 68
    outline_thickness = 2
    inner_color = rgba(050505c8)
    font_color = $color_text

    outer_color = rgba(ffffff24)
    check_color = $color_accent
    fail_color = $color_error

    fade_on_empty = false
    rounding = 16

    font_family = $font
    placeholder_text = Enter a password...
    fail_text = Authentication failed

    dots_size = 0.24
    dots_spacing = 0.25

    position = 0, -68
    halign = center
    valign = center
}

label {
    monitor = DP-5
    text = Locked
    font_size = 18
    font_family = $font
    color = $color_text_muted

    position = 0, -144
    halign = center
    valign = center
}

label {
    monitor = DP-5
    text = $TIME
    font_size = 108
    font_family = $font
    color = $color_text

    position = 0, 196
    halign = center
    valign = center
}

label {
    monitor = DP-5
    text = cmd[update:60000] date +"%A, %B %-d"
    font_size = 29
    font_family = $font
    color = $color_text_muted

    position = 0, 98
    halign = center
    valign = center
}

label {
    monitor = DP-5
    text = Welcome, trev
    font_size = 22
    font_family = $font
    color = $color_text_muted

    position = 0, 38
    halign = center
    valign = center
}

label {
    monitor = DP-5
    text = $LAYOUT[en,ru]
    font_size = 18
    font_family = $font
    color = $color_text_muted
    onclick = niri msg action switch-layout next

    position = -28, 28
    halign = right
    valign = bottom
}

label {
    monitor = DP-5
    text = cmd[update:30000] sh -c 'capacity=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n1); [ -n "$capacity" ] && printf "%s%%" "$capacity"'
    font_size = 18
    font_family = $font
    color = $color_text_muted

    position = 28, 28
    halign = left
    valign = bottom
}
