general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    # after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = sh -c 'niri msg --json outputs | jq -e ".[] | select(.name == \"eDP-1\" and .current_mode != null
  and .logical != null)" >/dev/null && brightnessctl -s set 10'
    on-resume = sh -c 'niri msg --json outputs | jq -e ".[] | select(.name == \"eDP-1\" and .current_mode != null
  and .logical != null)" >/dev/null && brightnessctl -r'
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
# listener {
#     timeout = 150                                          # 2.5min.
#     on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight.
#     on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
# }

listener {
    timeout = 600
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 601
    on-timeout = niri msg action power-off-monitors
    on-resume = niri msg action power-on-monitors
}

# Put monitor to sleep after 30 seconds when locked
listener {
   timeout = 30
   on-timeout = pidof hyprlock && niri msg action power-off-monitors
   on-resume = niri msg action power-on-monitors
}

