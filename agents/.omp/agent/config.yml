modelRoles:
  default: openai-codex/gpt-6.1-sol:medium
  smol: openai-codex/gpt-6.1-terra
  slow: openai-codex/gpt-6.1-sol:auto
symbolPreset: nerd
composer:
  shape: band
theme:
  dark: obsidian
  light: light
setupVersion: 2
memory:
  backend: "off"
statusLine:
  separator: powerline-thin
  contextLine: annotated
  transparent: true
  compactThinkingLevel: false
  showHookStatus: true
tui:
  codexResetFireworks: true
display:
  cacheMissMarker: true
  hideToolActivity: true
  showTokenUsage: true
colorBlindMode: true
task:
  maxEffort: medium
  eager: preferred
  enableEffort: true
  agentPrewalk:
    task: "off"
    reviewer: "off"
    scout: "off"
  showResolvedModelBadge: true
github:
  enabled: true
hideThinkingBlock: true
dev:
  autoqaConsent: granted
extendedContext: true
codexResets:
  autoRedeem: "no"
