# Shared preferences; Nix assembles the include-only root.
# Physical output modes and workspace topology belong to the host.

[general]
autostart = ["brave", "Telegram", "emacs"]
xwayland_native_resolution = true
nvidia_sync_workaround = false
show_cheatsheet = false

[appearance]
corner_radius = 16
border_width = 2
outer_border_width = 0
prefer_no_csd = true

[appearance.title_bar]
mode = "off"

[appearance.blur]
enabled = true
optimized = true
passes = 2
radius = 3
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1

[appearance.shadow]
enabled = true
softness = 24
offset_x = 4
offset_y = 4

[colors]
shadow = "#00000055"

[animation.windows_in]
style = "popin"
scale = 0.6
curve = "spring:1,800"

[animation.windows_out]
style = "popin"
scale = 0.8
curve = "spring:1,1400"

[animation.windows_move]

[animation.windows_resize]

[animation.workspaces]
duration_ms = 220
curve = "easeout"

[animation.overview]
curve = "spring:.8,460"

[layout]
mode = "scrolling"
gap = 20
extent_presets = [0.5, 0.667, 1.0]
client_maximize = "column"

[layout.scrolling]
default_extent_fraction = 0.5
center_underfull_strip = true
center_focused = "never"
center_on_overview_select = false

[layout.dwindle]
preserve_split = false
new_toward_cursor = false

[layout.master]
position = "left"
default_width_fraction = 0.55
new_on_top = true
new_becomes_master = false

[layout.stacking]
drop_zones = true

[input.focus]
follows_mouse = true
hover_raises = false
follows_mouse_max_scroll = 0.0

[input.cursor]
follows_focus = false
theme = "Adwaita"
size = 24

[input.keyboard]
layout = "us,ru"
options = "grp:win_space_toggle,compose:ralt,ctrl:nocaps"
repeat_delay = 250
repeat_rate = 50
numlock_toggle = true
track_layout = "global"

[input.touchpad]
tap = true
natural_scroll = true

[input.mouse]
accel_profile = "flat"

# Complete shared keymap, including retained native defaults.
# Mod+Q is unbound; Mod+Space is reserved for XKB language switching.
# Nix adds only browser, layout chooser, wallpaper and theme-mode package paths.
[keybinds]

# Applications and session
"Mod+Return" = { action = "spawn kitty", repeat = false }
"Mod+E" = { action = "spawn noctalia msg panel-toggle launcher", repeat = false }
"Mod+grave" = { action = "spawn voxtype record toggle", repeat = false }
"Mod+W" = { action = "window-close", repeat = false }
"Mod+Escape" = "session-quit"
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
"Mod+Alt+T" = { action = "spawn theme-switch", repeat = false }
"Mod+Shift+L" = { action = "spawn noctalia msg session lock", allow_when_inhibited = true, repeat = false }

# Media, volume and brightness remain available while locked.
"XF86AudioRaiseVolume" = { action = "spawn noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn noctalia msg media next", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn noctalia msg media previous", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn noctalia msg brightness-down", allow_when_locked = true }

# Focus and movement
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"
"Mod+F1" = "window-focus-next"
"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Down" = "window-move-down"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+Right" = "column-move-right"
"Mod+Ctrl+H" = "column-move-left"
"Mod+Ctrl+L" = "column-move-right"
"Mod+Ctrl+Left" = "output-focus-left"
"Mod+Ctrl+Down" = "output-focus-down"
"Mod+Ctrl+Up" = "output-focus-up"
"Mod+Ctrl+Right" = "output-focus-right"

# Window state and layout
"Mod+T" = { action = "window-toggle-floating", repeat = false }
"Mod+Shift+T" = { action = "window-focus-switch-floating", repeat = false }
"Mod+P" = { action = "window-toggle-pinned", repeat = false }
"Mod+M" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+F" = { action = "window-toggle-maximize", repeat = false }
"Mod+Ctrl+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-primary-extent-back"
"Mod+C" = { action = "column-center", repeat = false }
"Mod+Minus" = "window-modify-primary-extent -0.05"
"Mod+Equal" = "window-modify-primary-extent 0.05"
"Mod+Comma" = "window-consume-left"
"Mod+Period" = "window-consume-right"
"Mod+Ctrl+Comma" = "window-consume-from-left"
"Mod+Ctrl+Period" = "window-consume-from-right"
"Mod+Ctrl+T" = { action = "column-toggle-tabbed", repeat = false }
"Mod+Alt+Right" = "column-focus-tab-next"
"Mod+Alt+Left" = "column-focus-tab-previous"
"Mod+WheelUp" = "window-focus-left"
"Mod+WheelDown" = "window-focus-right"
"Mod+O" = { action = "overview-toggle", repeat = false }
"Mod+BracketLeft" = { action = "window-consume-or-expel-left", repeat = false }
"Mod+BracketRight" = { action = "window-consume-or-expel-right", repeat = false }
"Mod+Alt+L" = { action = "workspace-set-layout toggle scrolling dwindle master stacking", repeat = false }
"Mod+Shift+Slash" = { action = "cheatsheet-toggle", repeat = false }

# Workspaces
"Mod+1" = "workspace-switch 1"
"Mod+2" = "workspace-switch 2"
"Mod+3" = "workspace-switch 3"
"Mod+4" = "workspace-switch 4"
"Mod+Shift+1" = "window-move-to-workspace 1"
"Mod+Shift+2" = "window-move-to-workspace 2"
"Mod+Shift+3" = "window-move-to-workspace 3"
"Mod+Shift+4" = "window-move-to-workspace 4"

# Scratchpad: S stays separate from XKB's Mod+Space layout switching.
"Mod+Shift+S" = { action = "window-move-to-scratchpad", repeat = false }
"Mod+S" = { action = "scratchpad-toggle", repeat = false }
"Mod+Ctrl+S" = { action = "window-restore-from-scratchpad", repeat = false }
"Mod+Tab" = "scratchpad-focus-next"

# Screenshots
"Print" = { action = "spawn noctalia msg screenshot-region", repeat = false }
"Shift+Print" = { action = "spawn noctalia msg screenshot-fullscreen", repeat = false }
"Ctrl+Print" = { action = "spawn noctalia msg screenshot-window", repeat = false }

# Opening placement on the preferred output; windows can still be moved manually.
[[window_rule]]
match.app_id = "^brave-browser$"
default_workspace = 1

[[window_rule]]
match.app_id = "^Emacs$"
default_workspace = 2

[[window_rule]]
match.app_id = '^org\.telegram\.desktop$'
default_workspace = 3

# Brave starts full-width without changing floating dialogs or locking its size.
[[window_rule]]
match.app_id = "^brave-browser$"
match.is_floating = false
default_scrolling_extent = 1.0

# Kitty keeps its own 0.88 opacity; no global application blur or opacity rule.
[[window_rule]]
match.app_id = "^kitty$"
blur = true

# Pinned upstream Noctalia namespaces; only overlay panels sample live content.
[[layer_rule]]
match.namespace = '^noctalia-(bar-[^"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^"]*)$'
blur = true
blur_ignore_alpha = 0.5
blur_popups = true

[[layer_rule]]
match.namespace = "^noctalia-(notification|dock|panel|attached-panel|osd)$"
blur_optimized = false
